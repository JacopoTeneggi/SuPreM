[project]
name = "suprem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.9.*"
dependencies = [
    "torch==1.11.0",
    "torchvision==0.12.0",
    "torchaudio==0.11.0",
    "monai[all]==0.9.0",
    "connected-components-3d>=3.24.0",
    "h5py==3.6.0",
    "tqdm>=4.67.1",
    "fastremap>=1.17.4",
    "simpleitk>=2.5.2",
    "ipdb>=0.13.13",
    "matplotlib>=3.9.4",
    "tensorboardx>=2.6.4",
    "ml-collections>=0.1.1",
    "einops>=0.8.1",
    "timm>=1.0.19",
    "elasticdeform>=0.5.1",
    "numpy>=2.0.2",
    "nibabel>=5.3.2",
    "scipy>=1.13.1",
    "pandas>=2.3.2",
    "glob2>=0.7",
    "opencv-python>=4.12.0.88",
    "pytorch-lightning>=2.0.9.post0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu113" }]
torchvision = [{ index = "pytorch-cu113" }]
torchaudio = [{ index = "pytorch-cu113" }]

[[tool.uv.index]]
name = "pytorch-cu113"
url = "https://download.pytorch.org/whl/cu113"
explicit = true
